# Main CI pipeline: build, vet, test (with race detector), coverage, and
# exit-code gating.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build, vet and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Verify module downloads
        run: go mod verify

      - name: Build binary
        run: go build -o /tmp/elevated-cli ./cmd/elevated-cli

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test ./... -race -count=1

      - name: Test coverage
        run: go test ./... -coverprofile=/tmp/coverage.out

      - name: Gate on BLOCKED verdict exit code
        run: |
          set +e
          /tmp/elevated-cli audit --file test/data/code_samples/vulnerable/python_cmd_injection.py --no-sandbox >/dev/null 2>&1
          code=$?
          set -e
          if [ "$code" -ne 2 ]; then
            echo "::error::expected exit 2 (BLOCKED) for vulnerable fixture, got $code"
            exit 1
          fi

      - name: Gate on clean verdict exit code
        run: |
          if ! /tmp/elevated-cli audit --file test/data/code_samples/safe/python_clean.py --no-sandbox >/dev/null 2>&1; then
            echo "::error::expected exit 0 for safe fixture"
            exit 1
          fi
