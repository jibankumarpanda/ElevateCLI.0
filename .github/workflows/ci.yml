# Main CI pipeline: build, vet, test (with race detector), coverage.
name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build, vet and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Check go.mod is tidy
        run: go mod tidy -diff

      - name: Build binary
        run: go build -o /tmp/elevated-cli ./cmd/elevated-cli

      - name: Vet
        run: go vet ./...

      - name: Test (race detector)
        run: go test ./... -race -count=1

      - name: Test coverage
        run: go test ./... -coverprofile=/tmp/coverage.out